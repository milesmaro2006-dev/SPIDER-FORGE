[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spiderforge"
version = "3.0.0"
description = "Automated Web Reconnaissance, Crawling & Security Assessment Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Amr Shaban", email = "milesmaro2006-dev@users.noreply.github.com" },
]
keywords = [
    "security",
    "reconnaissance",
    "crawler",
    "pentest",
    "bug-bounty",
    "red-team",
    "anonymity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.0",
    "dnspython>=2.6.0",
    "socksio>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]
pdf = [
    "weasyprint>=62.0",
]
browser = [
    "playwright>=1.44.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "build>=1.2.0",
]

[project.scripts]
spiderforge = "spiderforge.cli.main:app"

[project.urls]
Homepage = "https://github.com/milesmaro2006-dev/spider-forge"
Repository = "https://github.com/milesmaro2006-dev/spider-forge"
Issues = "https://github.com/milesmaro2006-dev/spider-forge/issues"
Changelog = "https://github.com/milesmaro2006-dev/spider-forge/blob/main/CHANGELOG.md"
Security = "https://github.com/milesmaro2006-dev/spider-forge/blob/main/SECURITY.md"

[tool.setuptools]
packages = ["spiderforge", "backend"]

[tool.setuptools.package-data]
"backend" = ["static/frontend/*"]
"spiderforge" = ["reporting/templates/*", "reporting/assets/*"]

# ─────────────────────────────────────────────────────────────
#  Ruff
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 200
target-version = "py311"
extend-exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    ".git",
    ".github",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "C4"]
ignore = [
    # ── Deferred to Phase E (code quality pass) ─────────────
    "UP017",   # datetime.timezone.utc → datetime.UTC
    "UP037",   # redundant quotes in type annotations
    "UP041",   # asyncio.TimeoutError → TimeoutError
    "UP042",   # class X(str, Enum) → class X(StrEnum)
    "SIM105",  # try/except/pass → contextlib.suppress()
    "SIM108",  # if/else → ternary
    "SIM117",  # nested with → single with
    "B008",    # typer.Option()/Argument() in function defaults (Typer idiom)
    "B024",    # ABC without abstract methods
    "B904",    # raise-without-from
    "SIM102",  # nested if
    "E741",    # ambiguous variable name `l`
]

[tool.ruff.lint.per-file-ignores]
# Tests: informational lint issues deferred to Phase E.
"tests/**/*.py" = [
    "B",
    "SIM",
    "I001",
    "W292",
    "F401",
    "F541",
    "F841",
    "UP035",
    "UP045",
    "UP006",
    "UP028",
    "C408",
]
# Specific files with intentional informational deviations.
"spiderforge/evidence/collector.py" = ["I001"]
"__init__.py" = ["F401"]
"tests/__init__.py" = ["F401"]
"tests/**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ─────────────────────────────────────────────────────────────
#  Mypy
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = false
exclude = [
    "build/",
    "dist/",
    "\\.venv/",
    "venv/",
]

# ─────────────────────────────────────────────────────────────
#  Pytest
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not browser'"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["spiderforge"]
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
