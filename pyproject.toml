[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spiderforge"
version = "3.0.0"
description = "SpiderForge — Advanced Web Reconnaissance & Security Assessment Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Spidey", email = "spidey@redteam.local" }]
keywords = ["security", "pentest", "recon", "web", "xss", "sqli", "kali"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# ─── Core deps (CLI) ───
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pydantic>=2.7.0",
    "SQLAlchemy>=2.0.30",
    "PyYAML>=6.0.1",
    "Jinja2>=3.1.3",
    "dnspython>=2.6.1",
    "socksio>=1.0.0",
]

[project.optional-dependencies]
# Web (FastAPI + uvicorn)
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]
# PDF (needs system libs — see README)
pdf = [
    "weasyprint>=62.0",
]
# Playwright (advanced browser / DOM XSS)
browser = [
    "playwright>=1.44.0",
]
# Everything optional
all = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "weasyprint>=62.0",
]
# Development
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpserver>=1.0.12",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML",
    "build>=1.2.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "tomli-w>=1.0.0",
]

[project.scripts]
spiderforge = "spiderforge.cli.main:app"

[project.urls]
Homepage = "https://github.com/milesmaro2006-dev/spider-forge"
Issues = "https://github.com/milesmaro2006-dev/spider-forge/issues"

# ═══════════════════════════════════════════════════════════════
#  Hatchling build config
# ═══════════════════════════════════════════════════════════════

[tool.hatch.build.targets.wheel]
packages = ["spiderforge", "backend"]


[tool.hatch.build.targets.sdist]
include = [
    "/spiderforge",
    "/backend",
    "/frontend",
    "/scripts",
    "/tests",
    "/README.md",
    "/pyproject.toml",
    "/requirements.txt",
    "/LICENSE",
]

# ═══════════════════════════════════════════════════════════════
#  Ruff / Mypy / Pytest
# ═══════════════════════════════════════════════════════════════

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Browser tests require Playwright + Chromium. Skip by default;
# enable with: pytest --run-browser
addopts = "-m 'not browser'"
markers = [
    "browser: requires Playwright/Chromium; skipped unless --run-browser is passed",
]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    # Framework conventions — Typer/FastAPI use Option()/Depends() as defaults.
    "B008",
    # Stylistic preferences — the non-rewritten form is equally readable.
    "SIM105", "SIM108", "SIM117", "SIM102",
    # Protocol/mixin ABCs without abstract methods are legitimate.
    "B024",
    # Exception class names without "Error" suffix (e.g. ScopeViolation).
    "N818",
    # Single-letter names (l, I, O) appear in math/index code.
    "E741",
    # `raise X` inside `except` without `from` — deliberate in CLI exit paths.
    # Tracked for future cleanup; not a correctness issue.
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B007", "F841", "E501"]
