<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08090d" />
    <meta name="description" content="SpiderForge — Automated Web Reconnaissance & Security Assessment" />
    <title>SpiderForge — Web Security Assessment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>

<div class="app-shell" id="app-shell">

    <!-- ═══════════════ Sidebar ═══════════════ -->
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">

        <div class="sidebar-head">
            <a class="brand" href="#/" aria-label="SpiderForge home">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" fill="none">
                        <circle cx="16" cy="16" r="3.6" fill="currentColor"/>
                        <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.9">
                            <path d="M16 12.4 V3.2"/>
                            <path d="M16 19.6 V28.8"/>
                            <path d="M12.4 16 H3.2"/>
                            <path d="M19.6 16 H28.8"/>
                            <path d="M13.4 13.4 L6.4 6.4"/>
                            <path d="M18.6 13.4 L25.6 6.4"/>
                            <path d="M13.4 18.6 L6.4 25.6"/>
                            <path d="M18.6 18.6 L25.6 25.6"/>
                        </g>
                        <circle cx="16" cy="16" r="8.6" stroke="currentColor" stroke-width="1" opacity="0.35" fill="none" stroke-dasharray="2 3"/>
                        <circle cx="16" cy="16" r="12.4" stroke="currentColor" stroke-width="0.7" opacity="0.15" fill="none"/>
                    </svg>
                </span>
                <span class="brand-text">
                    <span class="brand-name">Spider<span class="brand-accent">Forge</span></span>
                    <span class="brand-sub">Recon &amp; Assessment</span>
                </span>
            </a>
            <button class="icon-btn sidebar-collapse" id="sidebar-collapse" aria-label="Toggle sidebar" aria-expanded="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>
        </div>

        <nav class="sidebar-nav" aria-label="Main">
            <a class="nav-item" href="#/" data-nav="dashboard" data-tooltip="Dashboard" title="Dashboard">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7.5" height="9" rx="1.6"/>
                    <rect x="13.5" y="3" width="7.5" height="5.5" rx="1.6"/>
                    <rect x="13.5" y="11.5" width="7.5" height="9.5" rx="1.6"/>
                    <rect x="3" y="15" width="7.5" height="6" rx="1.6"/>
                </svg>
                <span class="nav-label">Dashboard</span>
            </a>
            <a class="nav-item" href="#/scans" data-nav="scans" data-tooltip="Scans" title="Scans">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M12 3v9l6.4 4"/>
                </svg>
                <span class="nav-label">Scans</span>
                <span class="nav-badge" id="nav-badge-scans" hidden>0</span>
            </a>
            <a class="nav-item" href="#/findings" data-nav="findings" data-tooltip="Findings" title="Findings">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3.5v3"/><path d="M12 17.5v3"/>
                    <path d="M3.5 12h3"/><path d="M17.5 12h3"/>
                    <path d="M6 6l2.1 2.1"/><path d="M15.9 15.9L18 18"/>
                    <path d="M6 18l2.1-2.1"/><path d="M15.9 8.1L18 6"/>
                    <circle cx="12" cy="12" r="3.4"/>
                </svg>
                <span class="nav-label">Findings</span>
                <span class="nav-badge" id="nav-badge-findings" hidden>0</span>
            </a>
            <a class="nav-item" href="#/reports" data-nav="reports" data-tooltip="Reports" title="Reports">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 3.2H7.2A2.2 2.2 0 0 0 5 5.4v13.2a2.2 2.2 0 0 0 2.2 2.2h9.6a2.2 2.2 0 0 0 2.2-2.2V8z"/>
                    <path d="M14 3.2V8h4.9"/>
                    <path d="M9 13.5h6"/><path d="M9 17h4"/>
                </svg>
                <span class="nav-label">Reports</span>
            </a>

            <div class="sidebar-section">System</div>

            <a class="nav-item" href="#/settings" data-nav="settings" data-tooltip="Settings" title="Settings">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <span class="nav-label">Settings</span>
            </a>
        </nav>

        <div class="sidebar-foot">
            <button class="engine-status" id="engine-status" title="Backend status">
                <span class="status-dot" id="status-dot"></span>
                <div class="engine-meta">
                    <span class="engine-label">Engine</span>
                    <span class="engine-value" id="status-text">checking…</span>
                </div>
            </button>
            <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
                <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
                <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
            </button>
        </div>
    </aside>

    <button class="sidebar-overlay" id="sidebar-overlay" aria-label="Close menu" tabindex="-1"></button>

    <!-- ═══════════════ Main ═══════════════ -->
    <div class="main">
        <header class="mobile-bar">
            <button class="icon-btn" id="menu-btn" aria-label="Open menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/>
                </svg>
            </button>
            <span class="mobile-brand">Spider<span class="brand-accent">Forge</span></span>
            <span class="status-dot mobile-dot" id="status-dot-mobile"></span>
        </header>

        <main id="app" class="content" tabindex="-1" aria-live="polite"></main>
    </div>

</div>

<!-- Toast host -->
<div class="toast-host" id="toast-host" aria-live="polite" aria-atomic="false"></div>

<!-- Modal host -->
<div class="modal-host" id="modal-host" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<!-- Scan operation overlay -->
<div class="scan-overlay" id="scan-overlay" hidden>
    <div class="scan-overlay-backdrop"></div>
    <div class="scan-overlay-card" role="dialog" aria-modal="true" aria-labelledby="scan-ov-title">
        <div class="scan-ov-head">
            <span class="scan-ov-pulse"></span>
            <div>
                <h3 id="scan-ov-title">Assessment in progress</h3>
                <p class="scan-ov-target" id="scan-ov-target">—</p>
            </div>
        </div>
        <div class="scan-ov-bar">
            <div class="scan-ov-bar-fill" id="scan-ov-bar"></div>
        </div>
        <div class="scan-ov-phase">
            <span class="scan-ov-spinner"></span>
            <span id="scan-ov-phase">Initializing engine…</span>
        </div>
        <div class="scan-ov-stats" id="scan-ov-stats"></div>
        <p class="scan-ov-hint">This may take a moment. You'll be redirected to the report when it completes.</p>
    </div>
</div>

<script src="/app.js"></script>
</body>
</html>
