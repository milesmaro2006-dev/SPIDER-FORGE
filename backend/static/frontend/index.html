<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#06070b" />
    <meta name="description" content="SpiderForge — Web Security Assessment" />
    <title>SpiderForge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="#/">
            <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <circle cx="16" cy="16" r="3.6" fill="currentColor"/>
                <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.9">
                    <path d="M16 12.4 V3.2"/><path d="M16 19.6 V28.8"/>
                    <path d="M12.4 16 H3.2"/><path d="M19.6 16 H28.8"/>
                    <path d="M13.4 13.4 L6.4 6.4"/><path d="M18.6 13.4 L25.6 6.4"/>
                    <path d="M13.4 18.6 L6.4 25.6"/><path d="M18.6 18.6 L25.6 25.6"/>
                </g>
                <circle cx="16" cy="16" r="8.6" stroke="currentColor" stroke-width="1" opacity="0.3" fill="none" stroke-dasharray="2 3"/>
            </svg>
            <span class="brand-name">Spider<span class="brand-accent">Forge</span></span>
        </a>

        <nav class="nav">
            <a class="nav-link" href="#/" data-nav="dashboard">Dashboard</a>
            <a class="nav-link" href="#/settings" data-nav="settings">Settings</a>
        </nav>

        <div class="topbar-actions">
            <a class="engine-status" id="engine-status" href="#/settings" title="Backend status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">checking…</span>
            </a>
            <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
                <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
                <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
            </button>
        </div>
    </div>
</header>

<main id="app" class="content" tabindex="-1" aria-live="polite"></main>

<div class="toast-host" id="toast-host" aria-live="polite"></div>

<div class="modal-host" id="modal-host" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
