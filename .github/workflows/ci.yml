name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ─────────────────────────────────────────────────────────────
  #  Lint (blocking) — Ruff check only
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Ruff
        run: pip install "ruff>=0.6.0"

      - name: Ruff lint
        run: ruff check spiderforge backend tests --output-format=github

  # ─────────────────────────────────────────────────────────────
  #  Format check (non-blocking — informational)
  # ─────────────────────────────────────────────────────────────
  format:
    name: Format (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Ruff
        run: pip install "ruff>=0.6.0"

      - name: Ruff format check
        run: ruff format --check spiderforge backend tests || true

  # ─────────────────────────────────────────────────────────────
  #  Type checking (non-blocking — informational)
  # ─────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy (core only)
        run: mypy spiderforge/core --ignore-missing-imports || true

  # ─────────────────────────────────────────────────────────────
  #  Tests across Python versions (Linux) — 3.11+
  # ─────────────────────────────────────────────────────────────
  test-linux:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov

      - name: Run tests
        env:
          SPIDERFORGE_TEST_MODE: "1"
        run: pytest -v --tb=short

      - name: Coverage report
        if: matrix.python-version == '3.11'
        run: pytest --cov=spiderforge --cov-report=term-missing

  # ─────────────────────────────────────────────────────────────
  #  Tests on Windows (non-blocking — informational)
  # ─────────────────────────────────────────────────────────────
  test-windows:
    name: Test (Windows, Python 3.11 — informational)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (CLI-safe subset)
        run: pytest tests/unit -v --tb=short || true

  # ─────────────────────────────────────────────────────────────
  #  Build package (blocking — after tests pass)
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test-linux]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install build tools
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  #  Install smoke test
  # ─────────────────────────────────────────────────────────────
  install-smoke:
    name: Install Smoke Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install via pipx
        run: |
          pip install pipx
          pipx install .
          pipx ensurepath

      - name: Verify spiderforge --help
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          spiderforge --help

      - name: Doctor CLI-only mode
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          spiderforge doctor --cli-only --quiet || true
